SPECIFICATION RegressionSpec

CONSTANTS
    Server = {n1, n2, n3}
    Value = {common, conflict}
    NoNode = NoNode
    NoValue = NoValue
    MaxTerm = 3
    MaxLogLength = 3
    MaxInFlight = 3
    DeadlineClass = {nominal}
    LeaderNode = n1
    FollowerNode = n2
    WitnessNode = n3
    CommonValue = common
    ConflictingValue = conflict
    RegressionDeadline = nominal

CHECK_DEADLOCK FALSE

INVARIANT
    RegressionTypeOK
    InFlightBound
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AppliedPrefixConsistency
    CommittedEntryAgreement
    CommittedPrefixPresent
    RegressionCommitCapped
    RegressionMilestones
    RegressionOutcome

PROPERTY
    TransitionDisciplineProperty
    RegressionEventuallyExercisesReceive
    OldLengthRuleCounterexample
