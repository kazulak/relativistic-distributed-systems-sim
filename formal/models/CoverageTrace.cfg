SPECIFICATION CoverageSpec

CONSTANTS
    Server = {n1, n2, n3}
    Value = {v1}
    NoNode = NoNode
    NoValue = NoValue
    MaxTerm = 1
    MaxLogLength = 1
    MaxInFlight = 8
    DeadlineClass = {short, long}
    CandidateNode = n1
    VoterNode = n2
    OtherNode = n3
    ScenarioValue = v1

CHECK_DEADLOCK FALSE

INVARIANT
    CoverageTypeOK
    InFlightBound
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AppliedPrefixConsistency
    CommittedEntryAgreement
    CommittedPrefixPresent
    CoverageMilestones
    CoverageReached

PROPERTY
    TransitionDisciplineProperty
    CoverageEventuallyCompletes
